version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: augis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-augis_db}
      POSTGRES_USER: ${POSTGRES_USER:-augis_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-augis_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-augis_user} -d ${POSTGRES_DB:-augis_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: augis_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_augis_demo &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 config.wsgi:application"
    volumes:
      - media_vault:/app/media_private
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-augis-prod-secret-key-aicte-984210}
      - DEBUG=False
      - ALLOWED_HOSTS=localhost,127.0.0.1,web
      - DATABASE_URL=postgres://${POSTGRES_USER:-augis_user}:${POSTGRES_PASSWORD:-augis_secure_password_2026}@db:5432/${POSTGRES_DB:-augis_db}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_vault:
