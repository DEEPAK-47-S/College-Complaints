<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="60%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Shield Container -->
  <path d="M 60 8 C 88 8 108 18 108 42 C 108 78 78 105 60 114 C 42 105 12 78 12 42 C 12 18 32 8 60 8 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="3.5" 
        filter="url(#shadow)"/>

  <!-- Inner Gold Inset Border -->
  <path d="M 60 15 C 83 15 101 23 101 44 C 101 74 74 98 60 106 C 46 98 19 74 19 44 C 19 23 37 15 60 15 Z" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="1.2" 
        stroke-dasharray="3,2" 
        opacity="0.85"/>

  <!-- Graduation Cap (Mortarboard) -->
  <!-- Top diamond -->
  <polygon points="60,26 92,38 60,50 28,38" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <polygon points="60,29 88,38 60,47 32,38" fill="#ffffff" opacity="0.25"/>

  <!-- Cap Skull Base -->
  <path d="M 40 43 L 40 55 C 40 63 80 63 80 55 L 80 43 C 74 48 66 50 60 50 C 54 50 46 48 40 43 Z" 
        fill="url(#goldGrad)"/>

  <!-- Tassel -->
  <path d="M 60 38 L 88 50 L 89 62" fill="none" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="89" cy="63" r="2.5" fill="#fef08a"/>

  <!-- Open Book of Justice & Education -->
  <g transform="translate(60, 77) scale(0.95)" filter="url(#shadow)">
    <!-- Book Left Page -->
    <path d="M -3 -10 C -12 -13 -26 -11 -34 -7 L -34 14 C -26 10 -12 8 -3 11 Z" fill="url(#silverGrad)"/>
    <!-- Book Right Page -->
    <path d="M 3 -10 C 12 -13 26 -11 34 -7 L 34 14 C 26 10 12 8 3 11 Z" fill="url(#silverGrad)"/>
    <!-- Page Details Left -->
    <line x1="-28" y1="-2" x2="-8" y2="0" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-28" y1="4" x2="-8" y2="6" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Page Details Right -->
    <line x1="8" y1="0" x2="28" y2="-2" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="8" y1="6" x2="28" y2="4" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Spine Center -->
    <rect x="-2" y="-10" width="4" height="22" rx="1.5" fill="url(#goldGrad)"/>
  </g>

  <!-- Scales / Pillar Balance Accent -->
  <circle cx="60" cy="100" r="3" fill="url(#goldGrad)"/>
</svg>

